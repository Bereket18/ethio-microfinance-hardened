# docker/nginx/nginx.conf
# Reverse proxy + edge rate limiting, per Master Plan Part 7.2.
# This is the ONLY container whose port is published to the LAN
# (docker-compose.yml) -- it terminates all incoming traffic and forwards
# legitimate requests to the app container over the internal network.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Don't advertise nginx version (Part 2.1.13 -- information disclosure).
    server_tokens off;

    # --- Rate limiting zones (Part 6.3 / 7.2) ---
    # Token-bucket-style limiting keyed by client IP:
    #   - req_zone: general request rate (10 req/s, ~ light browsing pace)
    #   - login_zone: much stricter, applied only to login endpoints, since
    #     those are the highest-value brute-force targets
    limit_req_zone $binary_remote_addr zone=req_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=2r/s;

    # Concurrent-connection cap per IP (Part 7.2 -- mitigates Slowloris-style
    # many-slow-connections attacks, distinct from the request-rate limiters
    # above which target many-fast-requests attacks).
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # Timeouts short enough that a deliberately slow client can't tie up a
    # worker indefinitely (Part 7.2 -- Slowloris mitigation).
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;

    # Matches the app's own 2MB upload cap (includes/functions.php) --
    # reject oversized bodies before they reach PHP at all.
    client_max_body_size 3m;

    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.php;

        limit_conn conn_zone 20;

        # Stricter limiting specifically on login endpoints -- the highest-
        # value brute-force / credential-stuffing targets in this app.
        location ~ ^/modules/users/(login|admin_login|register)\.php$ {
            limit_req zone=login_zone burst=5 nodelay;
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_pass app:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # General app traffic -- looser limit with a burst allowance so
        # normal browsing (several assets loading at once) isn't penalized.
        location ~ \.php$ {
            limit_req zone=req_zone burst=20 nodelay;
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_pass app:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location / {
            limit_req zone=req_zone burst=20 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }

        # SECURITY: never let nginx serve the uploads/ directory's contents
        # as executable PHP, and never serve config/ or includes/ directly --
        # these should only ever be reached via an explicit .php location
        # block above, never as static file downloads.
        location ^~ /uploads/ {
            location ~ \.php$ { deny all; }
        }
        location ^~ /config/ { deny all; }
        location ^~ /includes/ { deny all; }
        location ^~ /.git/ { deny all; }
        location ^~ /docker/ { deny all; }
    }
}
