; docker/php/php-hardening.ini
; Defense-in-depth at the PHP runtime level (Part 4.4 of the Master Plan):
; even though eval()/system()/unserialize() were removed from our own code,
; disabling them at the engine level means a future bug or a missed file
; can't reintroduce that vulnerability class.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,eval,assert

; Don't advertise the PHP version in the X-Powered-By header (Part 2.1.13 --
; information disclosure).
expose_php = Off

; Never show stack traces / internal errors to visitors. Errors still go to
; the container's log (visible via `docker compose logs`), just not to the
; browser.
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; Match the app's own upload cap (includes/functions.php enforces 2MB, but
; the PHP-level limit should match so oversized uploads are rejected before
; even reaching application code).
upload_max_filesize = 2M
post_max_size = 3M

; Session hardening to match config/session.php's intent at the engine level.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
