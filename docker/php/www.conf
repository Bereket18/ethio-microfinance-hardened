; docker/php/www.conf
; PHP-FPM pool config -- overrides the image default to run as a non-root
; user (Part 5.3 of the Master Plan) and bound worker pool (Part 7.3 --
; graceful degradation instead of unbounded process spawning under load).

[www]
user = appuser
group = appuser
listen = 9000
listen.owner = appuser
listen.group = appuser

; Bounded worker pool: under a traffic flood, excess requests queue briefly
; or get a fast response from nginx's own limits (docker/nginx/nginx.conf)
; rather than PHP-FPM attempting to spawn unlimited workers and exhausting
; container memory.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Native PHP-FPM healthcheck endpoint (not a real script, PHP-FPM answers
; this itself over the FastCGI protocol) -- used by docker-compose.yml's
; healthcheck via cgi-fcgi, more reliable than guessing whether some
; third-party healthcheck script happens to be present in the base image.
pm.status_path = /status
ping.path = /ping
ping.response = pong
